[package]
name = "floret-protocol"
version = "0.1.0"
edition = "2024"

[features]
# Point the client at a server on this machine instead of the public IP.
dev-local = []

[dependencies]
# The protocol is headless. No renderer, no window - the server links this too.
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "bevy_log",
]}
lightyear = { version = "0.28.0", default-features = false, features = [
    "std",
    "replication",
    "prediction",
    "interpolation",
    "input_native",
]}
serde = { version = "1.0.229", features = ["derive"] }
